<!DOCTYPE html>
<!--
  ============================================================================
  PLANTILLA DE RECETA
  ============================================================================
  Cópiala a recetas/nombre-de-tu-receta.html y rellena los bloques marcados
  con los comentarios RELLENAR / FIN RELLENAR. No toques los estilos ni el
  script: así todas las recetas se ven y se comportan igual.

  Lee CONTRIBUTING.md antes de empezar; ahí está explicado el formato de tabla
  y cómo dar de alta la receta en el índice.

  Cuando termines, comprueba que no has descuadrado nada:
      python scripts/validar_recetas.py
  ============================================================================
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- RELLENAR: el nombre de la receta -->
<title>Nombre de la Receta</title>
<!-- FIN RELLENAR -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* --- paleta corporativa: no la cambies --- */
    --brand-red: #b3312c;
    --brand-gold: #d1a355;
    --brand-bg: #1a1210;
    --brand-bg-soft: #2b1c19;
    --brand-text: #f5ece4;
    --brand-text-dim: #c9b8ae;

    --bg: var(--brand-bg);
    --line: #4a2e28;
    --line-soft: var(--brand-bg-soft);
    --text: var(--brand-text);
    --text-dim: var(--brand-text-dim);
    --highlight: var(--brand-red);
    --highlight-border: var(--brand-gold);
  }
  * { box-sizing: border-box; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: "Work Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 28px 16px 80px;
  }
  h1{
    font-family: "Bebas Neue", "Work Sans", sans-serif;
    font-weight: 400;
    letter-spacing: 1px;
    text-align: center;
    font-size: 2.4rem;
    color: var(--brand-gold);
    margin: 0 0 4px;
  }
  .subtitle{ text-align: center; color: var(--text-dim); font-size: .9rem; margin: 0 0 18px; }

  .servings{
    max-width: 1100px;
    margin: 0 auto 22px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    font-size: .95rem;
  }
  .servings button{
    width: 30px; height: 30px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--line-soft);
    color: var(--text);
    font-size: 1rem;
    cursor: pointer;
  }
  .servings input{
    width: 42px;
    text-align: center;
    background: var(--line-soft);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 6px;
    padding: 4px;
    font-family: inherit;
    font-size: .95rem;
  }

  .table-wrap{
    max-width: 1400px;
    margin: 0 auto;
    overflow-x: auto;
  }
  table{
    width: 100%;
    min-width: 700px;   /* súbelo si tu receta tiene muchas columnas */
    border-collapse: collapse;
    border: 2px solid var(--line);
    background: var(--bg);
  }
  td{
    border-width: 0 1px 1px 0;
    border-style: solid;
    border-color: var(--line-soft);
    padding: 12px 14px;
    font-size: .88rem;
    line-height: 1.35;
    vertical-align: middle;
    transition: background .25s, border-color .25s;
  }
  td.full{ text-align: center; font-weight: 700; background: rgba(255,255,255,0.03); }
  td.ing{ text-align: left; }
  td.prep{ text-align: center; color: var(--text-dim); }
  td.cook{ text-align: center; color: var(--text); font-weight: 600; }
  td.gap{ border-right: none; }
  td.final{ text-align: center; font-weight: 600; }

  .qty{ color: var(--brand-gold); font-weight: 700; }

  td.active{
    background: var(--highlight);
    color: #fff;
    border: 2px solid var(--highlight-border);
  }
  td.active .qty{ color: #fff; text-decoration: underline; }

  .nav{
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 14px;
    padding: 14px;
    background: rgba(26,18,16,0.95);
    border-top: 1px solid var(--line);
  }
  .nav button{
    font-size: 1rem;
    padding: 10px 20px;
    border-radius: 8px;
    border: 1px solid var(--brand-red);
    background: var(--brand-red);
    color: #fff;
    cursor: pointer;
    font-weight: 600;
  }
  .nav button:disabled{ opacity: .35; cursor: default; background: var(--line-soft); border-color: var(--line); }
  .nav .label{
    align-self: center;
    color: var(--text-dim);
    font-size: .85rem;
    min-width: 160px;
    text-align: center;
  }
</style>
</head>
<body>

<!-- RELLENAR: título y subtítulo (tiempo total y, si procede, una nota corta) -->
<h1>Nombre de la Receta</h1>
<p class="subtitle">~30 min</p>
<!-- FIN RELLENAR -->

<div class="servings">
  <span>Comensales:</span>
  <button id="minusBtn">−</button>
  <!-- El value de aquí debe coincidir con BASE_SERVINGS del script de abajo -->
  <input type="number" id="servingsInput" value="4" min="1" max="20">
  <button id="plusBtn">+</button>
</div>

<!--
  ==========================================================================
  LA TABLA
  ==========================================================================
  Se lee como un diagrama de Gantt: cada FILA es un ingrediente y las
  COLUMNAS avanzan en el tiempo, de izquierda a derecha.

    td.full   fila entera: algo que se hace sin ingrediente asociado
              (poner agua a hervir, precalentar el horno...)
    td.ing    el ingrediente, con su cantidad escalable
    td.prep   qué se le hace en frío (picar, pelar, escurrir)
    td.cook   qué se le hace al fuego
    td.final  el emplatado, al final de todo
    td.gap    celda vacía de relleno

  REGLA DE ORO: todas las filas deben sumar el mismo número de columnas,
  contando lo que ocupan los rowspan de las filas de arriba. Rellena los
  huecos con <td class="gap"></td>. Si te descuadras, la tabla se rompe
  entera; el validador te dice qué fila falla.

  Los data-step numeran los pasos de la navegación de abajo: 1..N, sin
  saltos. Varias celdas pueden compartir el mismo paso (se iluminan juntas).
  ==========================================================================
-->
<div class="table-wrap">
<table>
  <!-- RELLENAR: sustituye este ejemplo por tu receta -->

  <!-- Paso sin ingrediente: colspan = número total de columnas de la tabla -->
  <tr><td class="full" data-step="1" colspan="4">Poner una olla de agua a hervir con sal</td></tr>

  <tr>
    <td class="ing"><span class="qty" data-base="300" data-unit="g">300</span> g del ingrediente principal</td>
    <td class="prep" data-step="2" rowspan="2">trocear</td>
    <td class="cook" data-step="2" rowspan="2">sofreír 5 min a fuego medio</td>
    <td class="final" data-step="4" rowspan="3">Servir caliente</td>
  </tr>
  <tr>
    <!-- Esta fila solo lleva el ingrediente: las otras 3 columnas las ocupan
         los rowspan de la fila anterior -->
    <td class="ing"><span class="qty" data-base="2" data-unit="ud" data-decimals="0">2</span> dientes de ajo</td>
  </tr>
  <tr>
    <td class="ing"><span class="qty" data-base="150" data-unit="ml">150</span> ml de caldo</td>
    <td class="prep" data-step="3">calentar aparte</td>
    <td class="cook" data-step="3">añadir y cocer 10 min</td>
    <!-- La cuarta columna la ocupa el rowspan="3" de td.final -->
  </tr>

  <!-- FIN RELLENAR -->
</table>
</div>

<div class="nav">
  <button id="prevBtn">◀ Paso anterior</button>
  <span class="label" id="stepLabel">Paso 1 de 4</span>
  <button id="nextBtn">Paso siguiente ▶</button>
</div>

<script>
  // --- navegación de pasos ---
  // RELLENAR: totalSteps = el data-step más alto que hayas usado en la tabla
  const totalSteps = 4;
  // /RELLENAR
  let current = 1;
  const cells = document.querySelectorAll('[data-step]');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const label = document.getElementById('stepLabel');

  function renderStep(){
    cells.forEach(c => c.classList.toggle('active', Number(c.dataset.step) === current));
    label.textContent = `Paso ${current} de ${totalSteps}`;
    prevBtn.disabled = current === 1;
    nextBtn.disabled = current === totalSteps;
  }
  prevBtn.addEventListener('click', () => { if (current > 1) current--; renderStep(); });
  nextBtn.addEventListener('click', () => { if (current < totalSteps) current++; renderStep(); });
  renderStep();

  // --- escalado de comensales ---
  // Para cuántos comensales están escritas las cantidades data-base.
  // Debe coincidir con el value del input de arriba. Por convención, 4.
  const BASE_SERVINGS = 4;
  const servingsInput = document.getElementById('servingsInput');
  const minusBtn = document.getElementById('minusBtn');
  const plusBtn = document.getElementById('plusBtn');
  const qtyEls = document.querySelectorAll('.qty');

  function renderServings(){
    const servings = Math.max(1, Number(servingsInput.value) || BASE_SERVINGS);
    const factor = servings / BASE_SERVINGS;
    qtyEls.forEach(el => {
      const base = Number(el.dataset.base);
      const decimals = el.dataset.decimals !== undefined ? Number(el.dataset.decimals) : 1;
      const scaled = base * factor;
      el.textContent = decimals === 0 ? Math.round(scaled) : scaled.toFixed(decimals);
    });
  }
  minusBtn.addEventListener('click', () => { servingsInput.value = Math.max(1, Number(servingsInput.value) - 1); renderServings(); });
  plusBtn.addEventListener('click', () => { servingsInput.value = Number(servingsInput.value) + 1; renderServings(); });
  servingsInput.addEventListener('input', renderServings);
  renderServings();
</script>

</body>
</html>
