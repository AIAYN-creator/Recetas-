<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Recetario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-red: #b3312c;
    --brand-gold: #d1a355;
    --brand-bg: #1a1210;
    --brand-bg-soft: #2b1c19;
    --brand-text: #f5ece4;
    --brand-text-dim: #c9b8ae;
    --line: #4a2e28;
  }
  * { box-sizing: border-box; }
  body{
    background: var(--brand-bg);
    color: var(--brand-text);
    font-family: "Work Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 28px 16px 60px;
  }
  h1{
    font-family: "Bebas Neue", sans-serif;
    font-weight: 400;
    letter-spacing: 1px;
    text-align: center;
    font-size: 2.6rem;
    color: var(--brand-gold);
    margin: 0 0 22px;
  }
 
  .controls{
    max-width: 900px;
    margin: 0 auto 26px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #searchInput{
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--brand-bg-soft);
    color: var(--brand-text);
    font-family: inherit;
  }
  .filter-group{ display: flex; flex-direction: column; gap: 6px; }
  .filter-group .label{ font-size: .78rem; color: var(--brand-text-dim); text-transform: uppercase; letter-spacing: .5px; }
  .chip-row{ display: flex; flex-wrap: wrap; gap: 8px; }
  .chip{
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--brand-bg-soft);
    color: var(--brand-text-dim);
    font-size: .82rem;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .chip.active{
    background: var(--brand-red);
    border-color: var(--brand-red);
    color: #fff;
    font-weight: 600;
  }
 
  .grid{
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .card{
    display: block;
    text-decoration: none;
    color: inherit;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    background: var(--brand-bg-soft);
    transition: border-color .2s, transform .2s;
  }
  .card:hover{ border-color: var(--brand-gold); transform: translateY(-2px); }
  .card h2{
    font-family: "Bebas Neue", sans-serif;
    font-weight: 400;
    letter-spacing: .5px;
    font-size: 1.3rem;
    color: var(--brand-text);
    margin: 0 0 10px;
  }
  .badges{ display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .badge{
    font-size: .75rem;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(255,255,255,0.05);
    color: var(--brand-text-dim);
  }
  .badge.time{ color: var(--brand-gold); }
  .badge.prep{ color: var(--brand-red); border: 1px solid var(--brand-red); }
  .empty{
    text-align: center;
    color: var(--brand-text-dim);
    padding: 40px 0;
    grid-column: 1 / -1;
  }
</style>
</head>
<body>
 
<h1>Mi Recetario</h1>
 
<div class="controls">
  <input type="text" id="searchInput" placeholder="Buscar receta por nombre...">
 
  <div class="filter-group">
    <span class="label">Excluir alérgenos</span>
    <div class="chip-row" id="allergenFilters"></div>
  </div>
 
  <div class="filter-group">
    <span class="label">Tiempo de preparación</span>
    <div class="chip-row" id="timeFilters">
      <span class="chip active" data-time="all">Todas</span>
      <span class="chip" data-time="short">&lt; 30 min</span>
      <span class="chip" data-time="medium">30–60 min</span>
      <span class="chip" data-time="long">+ 60 min</span>
    </div>
  </div>
 
  <div class="filter-group">
    <span class="label">Preparación previa</span>
    <div class="chip-row" id="prepFilters">
      <span class="chip active" data-prep="all">Todas</span>
      <span class="chip" data-prep="yes">Requiere prep. previa</span>
      <span class="chip" data-prep="no">Sin prep. previa</span>
    </div>
  </div>
</div>
 
<div class="grid" id="grid"></div>
 
<script>
  // --- alérgenos estándar UE, con emoji a modo de pictograma ---
  const ALLERGENS = [
    { id: "gluten",    label: "Gluten",         emoji: "🌾" },
    { id: "crustaceos",label: "Crustáceos",     emoji: "🦐" },
    { id: "huevo",     label: "Huevo",          emoji: "🥚" },
    { id: "pescado",   label: "Pescado",        emoji: "🐟" },
    { id: "cacahuete", label: "Cacahuete",      emoji: "🥜" },
    { id: "soja",      label: "Soja",           emoji: "🫘" },
    { id: "lacteos",   label: "Lácteos",        emoji: "🥛" },
    { id: "frutos_cascara", label: "Frutos de cáscara", emoji: "🌰" },
    { id: "apio",      label: "Apio",           emoji: "🥬" },
    { id: "mostaza",   label: "Mostaza",        emoji: "🟡" },
    { id: "sesamo",    label: "Sésamo",         emoji: "◦" },
    { id: "sulfitos",  label: "Sulfitos",       emoji: "🍷" },
    { id: "altramuces",label: "Altramuces",     emoji: "🫛" },
    { id: "moluscos",  label: "Moluscos",       emoji: "🦪" },
  ];
 
  // --- base de datos de recetas: añade una entrada nueva cada vez que crees una receta ---
  const RECIPES = [
    {
      title: "Arroz de carne \"del senyoret\" con caldo de huesos",
      file: "recetas/arroz-senyoret-carne.html",
      allergens: ["gluten"], // trazas por la morcilla (pan rallado como relleno habitual)
      timeMinutes: 45,
      requiresPrep: true,
      prepText: "Caldo de huesos hecho con antelación (mín. 4h)"
    }
  ];
 
  function timeCategory(min){
    if (min < 30) return "short";
    if (min <= 60) return "medium";
    return "long";
  }
 
  // estado de filtros
  let searchTerm = "";
  let excludedAllergens = new Set();
  let timeFilter = "all";
  let prepFilter = "all";
 
  // render chips de alérgenos
  const allergenFiltersEl = document.getElementById("allergenFilters");
  ALLERGENS.forEach(a => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = `${a.emoji} ${a.label}`;
    chip.dataset.allergen = a.id;
    chip.addEventListener("click", () => {
      chip.classList.toggle("active");
      if (excludedAllergens.has(a.id)) excludedAllergens.delete(a.id);
      else excludedAllergens.add(a.id);
      render();
    });
    allergenFiltersEl.appendChild(chip);
  });
 
  // chips de tiempo (selección única)
  document.querySelectorAll("#timeFilters .chip").forEach(chip => {
    chip.addEventListener("click", () => {
      document.querySelectorAll("#timeFilters .chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      timeFilter = chip.dataset.time;
      render();
    });
  });
 
  // chips de preparación previa (selección única)
  document.querySelectorAll("#prepFilters .chip").forEach(chip => {
    chip.addEventListener("click", () => {
      document.querySelectorAll("#prepFilters .chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      prepFilter = chip.dataset.prep;
      render();
    });
  });
 
  document.getElementById("searchInput").addEventListener("input", (e) => {
    searchTerm = e.target.value.trim().toLowerCase();
    render();
  });
 
  function render(){
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
 
    const filtered = RECIPES.filter(r => {
      if (searchTerm && !r.title.toLowerCase().includes(searchTerm)) return false;
      if (r.allergens.some(a => excludedAllergens.has(a))) return false;
      if (timeFilter !== "all" && timeCategory(r.timeMinutes) !== timeFilter) return false;
      if (prepFilter === "yes" && !r.requiresPrep) return false;
      if (prepFilter === "no" && r.requiresPrep) return false;
      return true;
    });
 
    if (filtered.length === 0){
      grid.innerHTML = `<p class="empty">No hay recetas que cumplan estos filtros.</p>`;
      return;
    }
 
    filtered.forEach(r => {
      const card = document.createElement("a");
      card.className = "card";
      card.href = r.file;
 
      const allergenBadges = r.allergens.map(id => {
        const a = ALLERGENS.find(x => x.id === id);
        return `<span class="badge">${a.emoji} ${a.label}</span>`;
      }).join("");
 
      card.innerHTML = `
        <h2>${r.title}</h2>
        <div class="badges">
          <span class="badge time">⏱ ${r.timeMinutes} min</span>
          ${r.requiresPrep ? `<span class="badge prep">⚠ ${r.prepText}</span>` : ""}
          ${allergenBadges}
        </div>
      `;
      grid.appendChild(card);
    });
  }
 
  render();
</script>
 
</body>
</html>
